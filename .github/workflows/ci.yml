name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Pin ruff so a new upstream release can't silently break CI by
      # enabling new default rules against unchanged code (beacon-mcp
      # got bitten this way on 2026-07-24). Bump deliberately.
      - run: pip install "ruff==0.16.2"
      - run: ruff check drift_mcp tests
      - run: ruff format --check drift_mcp tests

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .[dev]
      - run: pytest
